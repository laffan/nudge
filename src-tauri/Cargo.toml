[package]
name = "nudge"
version = "0.1.0"
description = "A writing app where an AI guides the conversation and every word of the document is yours"
authors = ["Nate Laffan"]
edition = "2021"

[lib]
name = "nudge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
default = ["local-llm"]
# On-device inference through llama.cpp (src/ai/local.rs). Without it the
# app builds and runs with the online providers only, and Settings → AI
# says the offline model is not part of this build.
local-llm = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "fs", "io-util"] }
# webpki-roots (a bundled Mozilla root store) rather than native roots:
# iOS has no enumerable system trust store (the same choice Zotero Helper
# makes, for the same reason).
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "stream",
  "rustls-tls-webpki-roots",
] }
futures-util = "0.3"
thiserror = "2"
rand = "0.8"
encoding_rs = { version = "0.8", optional = true }

# llama.cpp. OpenMP is left out (Apple's toolchain has none; Metal does the
# work there). Metal is switched on for macOS and iOS below.
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"], optional = true }

[profile.release]
lto = "thin"
